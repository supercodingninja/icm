<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>I’m Coming Home to Mercy — Frederick D. Thomas, Jr.</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    height:100dvh;
    overflow:hidden;
    background:#050b16 url("IMG_3183.jpeg") top center / cover no-repeat fixed;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    color:#fff;
  }
  body::after { content:""; position:fixed; inset:0; background:rgba(5,11,22,.35); z-index:0; pointer-events:none; }
  .stage {
    position:relative; z-index:1;
    height:100dvh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:2.2dvh;
    padding:2dvh 4vw;
    text-align:center;
  }
  video {
    width:auto; height:auto;
    max-width:min(72vw, 340px);
    max-height:52dvh;
    aspect-ratio:9/16;
    object-fit:cover;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    background:#000;
  }
  .title {
    font-size:clamp(13px, 2.6vw, 18px);
    font-weight:600;
    letter-spacing:.04em;
    color:#F3D98B;
    white-space:nowrap;
    text-shadow:0 2px 10px rgba(0,0,0,.7);
  }
  .btn {
    background:linear-gradient(135deg,#F3D98B,#C9A227 55%,#9c7c17);
    color:#0B1F3A;
    font-weight:800;
    font-size:clamp(14px, 3vw, 18px);
    border:none; border-radius:9999px;
    padding:1.6dvh 5vw;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(201,162,39,.5), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform:translateY(-2px) scale(1.03); }
  .btn:active { transform:scale(.97); }
</style>
</head>
<body>
  <div class="stage">
    <video id="v" playsinline controls preload="auto">
      <source src="Where_the_Road_Grew_Quiet_11-01%2001-34-28.mp4" type="video/mp4">
    </video>
    <p class="title">I&rsquo;m Coming Home to Mercy &middot; Frederick D. Thomas, Jr.</p>
    <button class="btn" id="btn" onclick="toggleSong()">&#9654; Full Song</button>
  </div>
  <audio id="song" preload="auto">
    <source id="songSrc" src="I%27m%20Coming%20Home%20to%20Mercy.m4a" type="audio/mp4">
  </audio>
<script>
  var v = document.getElementById("v"), song = document.getElementById("song"), btn = document.getElementById("btn");
  // auto-play once, with sound when allowed; volume/mute in controls
  (function autoplay() {
    v.muted = false;
    var p = v.play();
    if (p && p.then) p.then(function () {
      v.addEventListener("ended", function () { v.pause(); }, { once:true });
    }).catch(function () {
      v.muted = true; v.play().catch(function(){});
      var u = function () { v.muted = false; v.removeEventListener("play", u); };
      v.addEventListener("play", u);
    });
  })();
  var cands = ["I%27m%20Coming%20Home%20to%20Mercy.m4a","I%27m%20Coming%20Home%20to%20Mercy.wav","song.m4a","song.wav"], i = 0;
  document.getElementById("songSrc").addEventListener("error", function () {
    if (++i < cands.length) { this.src = cands[i]; song.load(); }
  });
  function toggleSong() {
    if (song.paused) { v.pause(); song.play(); } else { song.pause(); }
  }
  song.addEventListener("play",  function () { btn.innerHTML = "&#10073;&#10073; Playing — Tap to Pause"; });
  song.addEventListener("pause", function () { btn.innerHTML = "&#9654; Full Song"; });
  song.addEventListener("ended", function () { btn.innerHTML = "&#9654; Full Song"; });
</script>
</body>
</html>
