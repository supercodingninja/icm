<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I’m Coming Home to Mercy — Frederick D. Thomas, Jr.</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    background-color: #050b16;
    background-image: url("IMG_3183.jpeg"), url("img"), url("img.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  body::after { content:""; position:fixed; inset:0; background:rgba(5,11,22,.4); z-index:-1; pointer-events:none; }
  .gold-text { background: linear-gradient(92deg,#F3D98B,#C9A227 45%,#8A6D12); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .btn-gold { background: linear-gradient(135deg,#F3D98B,#C9A227 55%,#9c7c17); color:#0B1F3A; box-shadow:0 12px 40px rgba(201,162,39,.45), inset 0 1px 0 rgba(255,255,255,.5); transition: transform .18s ease, box-shadow .18s ease; }
  .btn-gold:hover { transform: translateY(-3px) scale(1.03); box-shadow:0 18px 55px rgba(201,162,39,.6), inset 0 1px 0 rgba(255,255,255,.5); }
  .btn-gold:active { transform: translateY(0) scale(.98); }
</style>
</head>
<body class="min-h-screen text-white flex items-center justify-center px-4 py-8 antialiased">
  <main class="w-full max-w-md text-center">

    <!-- WORDS FIRST -->
    <h1 class="gold-text text-3xl sm:text-5xl font-extrabold leading-tight">I&rsquo;m Coming Home<br>to Mercy</h1>

    <!-- PICTURE BELOW THE WORDS: square, smaller video -->
    <div class="mx-auto mt-8 rounded-2xl overflow-hidden border border-white/10 shadow-[0_25px_80px_rgba(0,0,0,.55)] bg-black max-w-[300px]">
      <video id="mercyVideo" class="w-full aspect-square object-cover"
             playsinline controls preload="auto">
        <source src="Where_the_Road_Grew_Quiet_11-01%2001-34-28.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <!-- SONG -->
    <button id="songBtn" onclick="toggleSong()"
            class="btn-gold relative mt-8 inline-flex items-center gap-3 rounded-full px-8 py-4 font-extrabold text-base sm:text-lg select-none">
      <svg id="iconPlay" class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="iconPause" class="w-6 h-6 hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      <span id="btnLabel">Hear the Whole Song</span>
    </button>

    <footer class="mt-10 text-slate-400 text-sm">
      <p>&copy; 2026 Frederick D. Thomas, Jr.</p>
    </footer>
  </main>

  <audio id="mercySong" preload="auto">
    <source id="songSrc" src="I%27m%20Coming%20Home%20to%20Mercy.m4a" type="audio/mp4">
  </audio>

<script>
  var video = document.getElementById("mercyVideo");
  var song  = document.getElementById("mercySong");
  var btn   = document.getElementById("songBtn");

  // Auto-play with sound, once; volume/mute stays in the controls.
  function autoplayUnmuted() {
    video.muted = false;
    var p = video.play();
    if (p && p.then) p.then(function () {
      video.addEventListener("ended", function () { video.pause(); }, { once: true });
    }).catch(function () {
      video.muted = true;
      video.play().then(function () {
        var unmute = function () { video.muted = false; video.removeEventListener("play", unmute); };
        video.addEventListener("play", unmute);
      }).catch(function () {});
    });
  }
  autoplayUnmuted();

  // Song filename fallbacks
  var songCandidates = [
    "I%27m%20Coming%20Home%20to%20Mercy.m4a",
    "I%27m%20Coming%20Home%20to%20Mercy.wav",
    "song.m4a",
    "song.wav"
  ];
  (function chainSong() {
    var src = document.getElementById("songSrc"), i = 0;
    src.addEventListener("error", function () {
      if (++i < songCandidates.length) { src.src = songCandidates[i]; song.load(); }
    });
  })();

  function toggleSong() {
    if (song.paused) { video.pause(); song.play(); }
    else { song.pause(); }
  }
  song.addEventListener("play",  function () {
    document.getElementById("iconPlay").classList.add("hidden");
    document.getElementById("iconPause").classList.remove("hidden");
    document.getElementById("btnLabel").textContent = "Now Playing — Tap to Pause";
  });
  song.addEventListener("pause", function () {
    document.getElementById("iconPlay").classList.remove("hidden");
    document.getElementById("iconPause").classList.add("hidden");
    document.getElementById("btnLabel").textContent = "Hear the Whole Song";
  });
  song.addEventListener("ended", function () { song.dispatchEvent(new Event("pause")); });
</script>
</body>
</html>
