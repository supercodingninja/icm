<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>I&rsquo;m Coming Home to Mercy</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    height:100dvh; overflow:hidden; position:relative;
    background:#050b16;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color:#fff;
  }
  /* ---- background: real img element (iOS-safe, unlike background-attachment:fixed) ---- */
  .bg { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; object-position:top center; z-index:0; }
  .shade { position:fixed; inset:0; background:rgba(5,11,22,.35); z-index:1; pointer-events:none; }

  /* ---- golden floating notes ---- */
  #notes { position:fixed; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
  .note { position:absolute; bottom:-8vh; color:#E9C767; text-shadow:0 0 6px rgba(243,217,139,.9), 0 0 14px rgba(201,162,39,.7);
          animation:rise linear infinite; opacity:0; will-change:transform,opacity; }
  .note.fall { bottom:auto; top:-8vh; animation-name:fall; }
  .spark { position:absolute; color:#FFF3C4; text-shadow:0 0 8px #F3D98B, 0 0 18px #C9A227;
           animation:twinkle ease-in-out infinite; opacity:0; }
  @keyframes rise {
    0%   { transform:translate(0,0) rotate(0deg);        opacity:0; }
    8%   { opacity:var(--o); }
    25%  { transform:translate(var(--dx1),-30vh) rotate(var(--r1)); }
    50%  { transform:translate(var(--dx2),-60vh) rotate(var(--r2)); }
    75%  { transform:translate(var(--dx1),-90vh) rotate(var(--r1)); opacity:var(--o); }
    100% { transform:translate(0,-120vh) rotate(0deg);   opacity:0; }
  }
  @keyframes fall {
    0%   { transform:translate(0,0) rotate(0deg);        opacity:0; }
    8%   { opacity:var(--o); }
    25%  { transform:translate(var(--dx1),30vh) rotate(var(--r1)); }
    50%  { transform:translate(var(--dx2),60vh) rotate(var(--r2)); }
    75%  { transform:translate(var(--dx1),90vh) rotate(var(--r1)); opacity:var(--o); }
    100% { transform:translate(0,120vh) rotate(0deg);    opacity:0; }
  }
  @keyframes twinkle {
    0%,100% { transform:scale(.4); opacity:0; }
    50%     { transform:scale(1.15); opacity:.95; }
  }

  /* ---- stage ---- */
  .stage { position:relative; z-index:3; height:100dvh; display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:2dvh; padding:2dvh 4vw; text-align:center; }
  video { max-width:min(72vw,340px); max-height:52dvh; aspect-ratio:9/16; object-fit:cover;
          border-radius:18px; border:1px solid rgba(255,255,255,.15);
          box-shadow:0 20px 60px rgba(0,0,0,.6); background:#000; }
  .title { font-size:clamp(13px,2.6vw,18px); font-weight:600; letter-spacing:.04em; color:#F3D98B;
           white-space:nowrap; text-shadow:0 2px 10px rgba(0,0,0,.7); }
  .btn { background:linear-gradient(135deg,#F3D98B,#C9A227 55%,#9c7c17); color:#0B1F3A; font-weight:800;
         font-size:clamp(14px,3vw,18px); border:none; border-radius:9999px; padding:1.6dvh 5vw; cursor:pointer;
         box-shadow:0 10px 30px rgba(201,162,39,.5), inset 0 1px 0 rgba(255,255,255,.5);
         transition:transform .15s ease; }
  .btn:active { transform:scale(.97); }
</style>
</head>
<body>
  <img class="bg" src="IMG_3183.jpeg" alt="">
  <div class="shade"></div>
  <div id="notes"></div>

  <div class="stage">
    <video id="v" src="Where_the_Road_Grew_Quiet_11-01%252001-34-28.mp4"
           playsinline controls preload="auto"></video>
    <p class="title">I&rsquo;m Coming Home to Mercy &middot; Frederick D. Thomas, Jr.</p>
    <button class="btn" id="btn">&#9654; Full Song</button>
  </div>

  <audio id="song" src="I%27m%20Coming%20Home%20to%20Mercy.m4a" preload="auto"></audio>

<script>
  // ---- golden notes + sparkles ----
  (function () {
    var box = document.getElementById("notes");
    var glyphs = ["\u266A", "\u266B", "\u2669", "\u266C"];
    function rnd(a, b) { return a + Math.random() * (b - a); }
    for (var i = 0; i < 16; i++) {
      var n = document.createElement("span");
      n.className = "note" + (i % 4 === 3 ? " fall" : "");
      n.textContent = glyphs[i % glyphs.length];
      n.style.left = rnd(2, 94) + "vw";
      n.style.fontSize = rnd(14, 30) + "px";
      n.style.animationDuration = rnd(9, 20) + "s";
      n.style.animationDelay = (-rnd(0, 20)) + "s";
      n.style.setProperty("--o", rnd(.45, .9).toFixed(2));
      n.style.setProperty("--dx1", rnd(-40, 40) + "px");
      n.style.setProperty("--dx2", rnd(-70, 70) + "px");
      n.style.setProperty("--r1", rnd(-25, 25) + "deg");
      n.style.setProperty("--r2", rnd(-40, 40) + "deg");
      box.appendChild(n);
    }
    for (var j = 0; j < 22; j++) {
      var s = document.createElement("span");
      s.className = "spark";
      s.textContent = "\u2726";
      s.style.left = rnd(1, 97) + "vw";
      s.style.top = rnd(2, 90) + "vh";
      s.style.fontSize = rnd(6, 14) + "px";
      s.style.animationDuration = rnd(1.8, 4) + "s";
      s.style.animationDelay = (-rnd(0, 4)) + "s";
      box.appendChild(s);
    }
  })();

  // ---- video: auto-play once, sound when allowed, else muted + unmute on first tap ----
  var v = document.getElementById("v"), song = document.getElementById("song"), btn = document.getElementById("btn");
  v.addEventListener("canplay", function once() {
    v.removeEventListener("canplay", once);
    v.muted = false;
    var p = v.play();
    if (p && p.then) p.then(function () {
      v.addEventListener("ended", function () { v.pause(); }, { once:true });
    }).catch(function () {
      v.muted = true;
      v.play().catch(function(){});
      var u = function () { v.muted = false; v.removeEventListener("play", u); };
      v.addEventListener("play", u);
    });
  });

  btn.addEventListener("click", function () {
    if (song.paused) { v.pause(); song.play(); } else { song.pause(); }
  });
  song.addEventListener("play",  function () { btn.innerHTML = "&#10073;&#10073; Playing &mdash; Tap to Pause"; });
  song.addEventListener("pause", function () { btn.innerHTML = "&#9654; Full Song"; });
  song.addEventListener("ended", function () { btn.innerHTML = "&#9654; Full Song"; });
</script>
</body>
</html>
